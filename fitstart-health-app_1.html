<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FitStart — Health & Antioxidant Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}

  /* ── Ambivert palette: warm stone meets muted sage ─────────────────────── */
  :root{
    /* Sage greens — present but not shouting */
    --sage-50:#F0F4EC;--sage-100:#D8E5CE;--sage-200:#B8CFA4;
    --sage-400:#7A9E5C;--sage-600:#4F7035;--sage-800:#2E4A1A;

    /* Stone — warm neutral ground */
    --stone-50:#FAF8F5;--stone-100:#F0EDE8;--stone-200:#E2DDD6;
    --stone-400:#B5AFA6;--stone-600:#7A756D;--stone-800:#3D3A35;

    /* Warm accents — quiet amber, soft terracotta */
    --amber-50:#FBF3E4;--amber-200:#F0C878;--amber-400:#C8922A;--amber-600:#8A620F;
    --terra-50:#F8EDE8;--terra-200:#E8B8A4;--terra-400:#C0634A;--terra-600:#8A3E28;
    --slate-50:#EEF0F4;--slate-400:#7A8A9E;--slate-600:#4A5A70;

    /* Surfaces — layered warmth */
    --bg:#F5F2EE;
    --surf:#FDFCFA;
    --surf2:#F0EDE8;
    --surf3:#E8E4DE;

    /* Borders — barely-there */
    --border:rgba(90,80,60,0.08);
    --border2:rgba(90,80,60,0.14);
    --border3:rgba(90,80,60,0.22);

    /* Text — warm, not harsh */
    --text:#2A2720;
    --text2:#6B6560;
    --text3:#A09890;

    /* Semantic */
    --accent:var(--sage-600);
    --accent-dark:var(--sage-800);
    --accent-light:var(--sage-50);

    --radius:16px;--radius-sm:10px;--radius-xs:6px;
  }

  html,body{
    height:100%;
    font-family:'Jost',sans-serif;
    background:var(--bg);
    color:var(--text);
    font-size:15px;
    letter-spacing:0.01em;
  }
  #root{height:100%;display:flex;flex-direction:column}

  ::-webkit-scrollbar{width:3px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--stone-400);border-radius:3px;opacity:0.5}

  /* ── Animations ──────────────────────────────────────────────────────────── */
  @keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.35}}
  @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
  .slide-up{animation:slideUp 0.28s cubic-bezier(.4,0,.2,1) both}
  .fade-in{animation:fadeIn 0.22s ease both}
  .pulse{animation:pulse 1.6s ease-in-out infinite}

  /* ── Login ───────────────────────────────────────────────────────────────── */
  .login-wrap{
    flex:1;display:flex;align-items:center;justify-content:center;
    padding:2rem;
    background:var(--bg);
    background-image:
      radial-gradient(circle at 20% 20%, rgba(122,158,92,0.06) 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(192,99,74,0.04) 0%, transparent 50%);
  }
  .login-card{
    width:100%;max-width:400px;
    background:var(--surf);
    border-radius:24px;
    border:1px solid var(--border2);
    padding:2.5rem 2.2rem;
  }
  .login-logo{
    font-family:'Lora',serif;
    font-size:2.4rem;
    color:var(--sage-800);
    margin-bottom:4px;
    letter-spacing:-0.02em;
  }
  .login-logo span{color:var(--sage-400)}
  .login-sub{font-size:13px;color:var(--text3);margin-bottom:1.8rem;font-weight:300;line-height:1.6}
  .feature-pills{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:1.8rem}
  .pill{
    font-size:11px;padding:4px 12px;border-radius:20px;
    background:var(--sage-50);color:var(--sage-600);
    font-weight:400;border:1px solid rgba(122,158,92,0.18);
    letter-spacing:0.02em;
  }
  .welcome-note{
    background:var(--stone-100);
    border-radius:12px;padding:14px 16px;
    margin-bottom:1.5rem;
    font-size:12.5px;color:var(--text2);line-height:1.65;
    border:1px solid var(--border);
  }
  .welcome-note strong{color:var(--text);font-weight:500}
  .google-btn{
    width:100%;display:flex;align-items:center;justify-content:center;gap:10px;
    padding:12px 20px;border-radius:12px;border:none;
    background:var(--sage-800);color:#fff;
    font-family:'Jost',sans-serif;font-size:13.5px;font-weight:500;
    cursor:pointer;transition:all 0.18s;letter-spacing:0.02em;
  }
  .google-btn:hover{background:var(--sage-600);transform:translateY(-1px)}
  .google-btn:active{transform:translateY(0)}
  .guest-btn{
    width:100%;padding:10px;border-radius:12px;
    border:1px solid var(--border3);background:transparent;
    color:var(--text2);font-family:'Jost',sans-serif;font-size:13px;
    cursor:pointer;margin-top:8px;transition:all 0.15s;letter-spacing:0.02em;
  }
  .guest-btn:hover{background:var(--stone-100);color:var(--text)}
  .login-note{font-size:11px;color:var(--text3);text-align:center;margin-top:12px;font-weight:300}

  /* ── App Layout ──────────────────────────────────────────────────────────── */
  .app-wrap{
    flex:1;display:flex;flex-direction:column;
    max-width:520px;width:100%;margin:0 auto;
    background:var(--surf);
    border-left:1px solid var(--border2);
    border-right:1px solid var(--border2);
  }

  /* ── Hero ────────────────────────────────────────────────────────────────── */
  .hero{
    background:var(--sage-800);
    padding:20px 20px 18px;
    position:relative;overflow:hidden;
  }
  /* subtle grain texture overlay */
  .hero::before{
    content:'';position:absolute;inset:0;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    opacity:0.4;pointer-events:none;
  }
  .hero::after{
    content:'';position:absolute;
    top:-60px;right:-60px;width:200px;height:200px;
    border-radius:50%;background:rgba(192,207,180,0.06);
    pointer-events:none;
  }
  .hero-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;position:relative}
  .hero-logo{
    font-family:'Lora',serif;font-size:1.55rem;
    color:#fff;letter-spacing:-0.01em;
  }
  .hero-logo span{color:var(--sage-200);font-style:italic}
  .hero-greeting{font-size:10px;color:rgba(255,255,255,0.42);margin-top:2px;font-weight:300;letter-spacing:0.04em}
  .hero-right{display:flex;align-items:center;gap:8px}
  .mode-badge{
    font-size:10px;padding:3px 10px;border-radius:20px;
    background:rgba(255,255,255,0.08);color:rgba(216,229,206,0.9);
    border:0.5px solid rgba(255,255,255,0.14);font-weight:400;
    letter-spacing:0.03em;
  }
  .avatar{
    width:32px;height:32px;border-radius:50%;
    background:rgba(255,255,255,0.12);
    display:flex;align-items:center;justify-content:center;
    font-weight:500;font-size:13px;color:rgba(255,255,255,0.9);
    cursor:pointer;border:1px solid rgba(255,255,255,0.18);
    transition:background 0.15s;
  }
  .avatar:hover{background:rgba(255,255,255,0.2)}
  .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;position:relative}
  .stat-box{
    background:rgba(255,255,255,0.06);
    border:0.5px solid rgba(255,255,255,0.1);
    border-radius:10px;padding:9px 5px;text-align:center;
    transition:background 0.15s;
  }
  .stat-box:hover{background:rgba(255,255,255,0.1)}
  .stat-val{
    font-family:'Lora',serif;font-size:1.35rem;
    color:#fff;line-height:1;
  }
  .stat-lbl{font-size:9px;color:rgba(255,255,255,0.4);margin-top:3px;line-height:1.3;font-weight:300;letter-spacing:0.02em}

  /* ── Tab bar ──────────────────────────────────────────────────────────────── */
  .tab-bar{
    display:flex;background:var(--surf);
    border-bottom:1px solid var(--border2);
    position:sticky;top:0;z-index:20;
  }
  .tab-btn{
    flex:1;padding:10px 4px 8px;border:none;background:transparent;
    font-family:'Jost',sans-serif;font-size:10px;font-weight:400;
    color:var(--text3);cursor:pointer;
    border-bottom:2px solid transparent;
    transition:all 0.18s;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    letter-spacing:0.03em;
  }
  .tab-btn.active{color:var(--sage-600);border-bottom-color:var(--sage-600);font-weight:500}
  .tab-btn:hover:not(.active){color:var(--text2);background:var(--stone-100)}
  .tab-icon{font-size:15px;line-height:1}

  /* ── Content area ─────────────────────────────────────────────────────────── */
  .content{flex:1;overflow-y:auto;padding:16px}

  /* ── Cards ────────────────────────────────────────────────────────────────── */
  .card{
    background:var(--surf);
    border:1px solid var(--border2);
    border-radius:var(--radius);
    padding:15px 17px;margin-bottom:10px;
  }
  .card-muted{
    background:var(--stone-100);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:15px 17px;margin-bottom:10px;
  }
  .sec-label{
    font-size:10px;font-weight:500;text-transform:uppercase;
    letter-spacing:0.1em;color:var(--text3);margin-bottom:11px;
    font-family:'Jost',sans-serif;
  }

  /* ── Forms ────────────────────────────────────────────────────────────────── */
  .form-field{
    width:100%;background:var(--stone-100);
    border:1px solid var(--border2);border-radius:var(--radius-sm);
    padding:9px 13px;font-family:'Jost',sans-serif;font-size:13px;
    color:var(--text);outline:none;transition:all 0.18s;margin-bottom:8px;
    letter-spacing:0.01em;
  }
  .form-field::placeholder{color:var(--text3)}
  .form-field:focus{border-color:var(--sage-400);background:var(--surf);box-shadow:0 0 0 3px rgba(122,158,92,0.08)}
  .form-row{display:flex;gap:8px;margin-bottom:8px}
  .form-row .form-field{margin-bottom:0}
  select.form-field{cursor:pointer}

  /* ── Buttons ──────────────────────────────────────────────────────────────── */
  .btn-primary{
    background:var(--sage-800);color:#fff;border:none;
    border-radius:var(--radius-sm);padding:9px 16px;
    font-family:'Jost',sans-serif;font-size:13px;font-weight:500;
    cursor:pointer;transition:all 0.18s;white-space:nowrap;
    letter-spacing:0.03em;
  }
  .btn-primary:hover{background:var(--sage-600);transform:translateY(-1px)}
  .btn-primary:active{transform:scale(0.97) translateY(0)}
  .btn-primary:disabled{opacity:0.4;cursor:not-allowed;transform:none}
  .btn-full{width:100%;padding:12px;font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:12px}

  /* ── Log items ────────────────────────────────────────────────────────────── */
  .log-item{
    display:flex;align-items:flex-start;justify-content:space-between;
    padding:10px 0;border-bottom:1px solid var(--border);
  }
  .log-item:last-child{border-bottom:none}
  .log-name{font-size:13px;font-weight:500;color:var(--text);letter-spacing:0.01em}
  .log-meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px;align-items:center}
  .badge{font-size:10px;padding:2px 9px;border-radius:20px;font-weight:400;letter-spacing:0.02em}
  .badge-amber{background:var(--amber-50);color:var(--amber-600);border:1px solid rgba(200,146,42,0.2)}
  .badge-green{background:var(--sage-50);color:var(--sage-600);border:1px solid rgba(122,158,92,0.2)}
  .badge-teal{background:#EDF4F2;color:#3A7060;border:1px solid rgba(58,112,96,0.2)}
  .badge-red{background:var(--terra-50);color:var(--terra-600);border:1px solid rgba(192,99,74,0.2)}
  .log-note{font-size:11px;color:var(--text3)}
  .del-btn{background:none;border:none;cursor:pointer;color:var(--text3);font-size:18px;padding:0 4px;border-radius:4px;line-height:1;transition:color 0.15s}
  .del-btn:hover{color:var(--terra-400)}
  .empty{text-align:center;padding:2.5rem 0;color:var(--text3);font-size:13px;font-weight:300}
  .empty-icon{font-size:2rem;margin-bottom:8px;opacity:0.7}

  /* ── Tip / accent cards ────────────────────────────────────────────────────── */
  .tip-card{
    background:var(--sage-800);border-radius:var(--radius);
    padding:13px 16px;margin-bottom:10px;position:relative;overflow:hidden;
  }
  .tip-card::before{
    content:'';position:absolute;bottom:-20px;right:-20px;
    width:80px;height:80px;border-radius:50%;
    background:rgba(255,255,255,0.04);pointer-events:none;
  }
  .tip-label{font-size:9px;font-weight:500;letter-spacing:0.1em;color:rgba(255,255,255,0.38);margin-bottom:5px;text-transform:uppercase}
  .tip-text{font-size:12px;color:rgba(255,255,255,0.78);line-height:1.7;font-weight:300}

  /* ── Onboard banner ────────────────────────────────────────────────────────── */
  .onboard{
    background:var(--sage-50);
    border:1px solid rgba(122,158,92,0.16);
    border-radius:var(--radius);
    padding:13px 15px;margin-bottom:10px;display:flex;gap:11px;
  }
  .onboard-icon{font-size:1.3rem;flex-shrink:0;line-height:1.4;opacity:0.85}
  .onboard-text{font-size:12px;color:var(--sage-600);line-height:1.7;font-weight:300}
  .onboard-text strong{color:var(--sage-800);font-weight:500}

  /* ── Metrics ─────────────────────────────────────────────────────────────── */
  .metrics-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:10px}
  .metric{
    background:var(--stone-100);border-radius:var(--radius-sm);
    padding:13px 12px;text-align:center;
    border:1px solid var(--border);
  }
  .metric-val{
    font-family:'Lora',serif;font-size:1.85rem;
    color:var(--text);line-height:1;
  }
  .metric-lbl{font-size:11px;color:var(--text2);margin-top:4px;font-weight:400}
  .metric-sub{font-size:10px;color:var(--text3);margin-top:2px;font-weight:300}

  /* ── Progress bar ─────────────────────────────────────────────────────────── */
  .prog-wrap{background:var(--stone-200);border-radius:20px;height:8px;overflow:hidden;margin:8px 0 5px}
  .prog-bar{height:100%;border-radius:20px;background:var(--sage-400);transition:width 0.55s ease,background 0.3s}
  .prog-lbl{font-size:11px;color:var(--text2);font-weight:300}
  .goal-row{
    display:flex;justify-content:space-between;align-items:center;
    font-size:12.5px;padding:7px 0;border-bottom:1px solid var(--border);
  }
  .goal-row:last-child{border-bottom:none}
  .goal-row span:first-child{color:var(--text2);font-weight:300}
  .goal-row span:last-child{font-weight:500;color:var(--text)}

  /* ── Balance status block ─────────────────────────────────────────────────── */
  .balance-block{
    padding:12px 15px;font-size:12.5px;line-height:1.65;
    border-radius:var(--radius-xs);border-left:3px solid;
    margin-bottom:10px;font-weight:300;
  }
  .balance-block strong{font-weight:500}

  /* ── Belly Balance ────────────────────────────────────────────────────────── */
  .score-hero{
    background:var(--sage-800);border-radius:var(--radius);
    padding:15px 17px;margin-bottom:10px;position:relative;overflow:hidden;
  }
  .score-hero::before{
    content:'';position:absolute;
    top:-40px;right:-40px;width:130px;height:130px;
    border-radius:50%;background:rgba(255,255,255,0.04);pointer-events:none;
  }
  .score-val{font-family:'Lora',serif;font-size:2.6rem;color:#fff;line-height:1}
  .score-label-txt{
    font-size:9.5px;color:rgba(255,255,255,0.4);margin-bottom:4px;
    text-transform:uppercase;letter-spacing:0.1em;font-weight:300;
  }
  .score-level{font-size:12px;font-weight:400;margin-top:5px;letter-spacing:0.02em}
  .mode-btn{
    font-size:10px;padding:4px 11px;border-radius:20px;border:none;
    cursor:pointer;font-family:'Jost',sans-serif;transition:all 0.18s;
    letter-spacing:0.03em;
  }
  .mode-btn.on{background:rgba(255,255,255,0.16);color:#fff;font-weight:500}
  .mode-btn.off{background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.38);font-weight:300}
  .mode-btn.off:hover{background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.65)}

  .cat-pills{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:11px}
  .cat-pill{
    font-size:10px;padding:4px 11px;border-radius:20px;cursor:pointer;
    transition:all 0.15s;border:1px solid transparent;
    font-family:'Jost',sans-serif;letter-spacing:0.02em;
  }
  .cat-pill.on{background:var(--sage-800);color:#fff;font-weight:500}
  .cat-pill.off{background:var(--stone-100);color:var(--text2);border-color:var(--border)}
  .cat-pill.off:hover{background:var(--stone-200);color:var(--text)}

  .portion-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
  .portion-btn{
    padding:9px 4px;border-radius:var(--radius-xs);font-size:10px;text-align:center;
    cursor:pointer;border:1px solid var(--border2);
    font-family:'Jost',sans-serif;transition:all 0.15s;
    background:var(--stone-100);color:var(--text2);letter-spacing:0.01em;
  }
  .portion-btn:hover{background:var(--stone-200);color:var(--text)}
  .portion-btn.on{
    background:var(--sage-50);border-color:var(--sage-400);
    color:var(--sage-800);font-weight:500;
  }

  .food-log-item{
    display:flex;align-items:center;justify-content:space-between;
    padding:9px 0;border-bottom:1px solid var(--border);
  }
  .food-log-item:last-child{border-bottom:none}
  .food-emoji{font-size:18px;margin-right:9px;flex-shrink:0;opacity:0.9}
  .food-name-txt{font-size:13px;font-weight:500;color:var(--text)}
  .food-cat-txt{font-size:10px;color:var(--text3);font-weight:300;margin-top:1px}
  .food-score-val{font-size:13px;font-weight:500;color:var(--sage-600)}

  /* ── AI output ────────────────────────────────────────────────────────────── */
  .ai-output{
    font-size:13px;line-height:1.85;color:var(--text);
    white-space:pre-wrap;font-weight:300;
  }

  /* ── Achievements ─────────────────────────────────────────────────────────── */
  .badge-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .achievement{
    background:var(--stone-100);border-radius:var(--radius-sm);
    padding:11px 13px;display:flex;align-items:center;gap:10px;
    opacity:0.35;transition:all 0.3s;
    border:1px solid var(--border);
  }
  .achievement.unlocked{
    opacity:1;background:var(--sage-50);
    border:1px solid rgba(122,158,92,0.22);
  }
  .ach-icon{font-size:1.4rem;flex-shrink:0;line-height:1}
  .ach-name{font-size:12px;font-weight:500;color:var(--sage-800)}
  .ach-desc{font-size:10px;color:var(--text3);margin-top:2px;font-weight:300}
  .achievement.unlocked .ach-desc{color:var(--sage-600)}

  /* ── Footer ───────────────────────────────────────────────────────────────── */
  footer{
    text-align:center;padding:12px;font-size:10.5px;color:var(--text3);
    border-top:1px solid var(--border);background:var(--surf);
    font-weight:300;letter-spacing:0.03em;
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useCallback } = React;

// ─── Data ───────────────────────────────────────────────────────────────────
const ANTIOXIDANT_FOODS = [
  {id:'blueberries',name:'Blueberries',emoji:'🫐',category:'Berries',baseScore:90,desc:'High in anthocyanins',mm:{balanced:1,dieting:1.2,digestion:1}},
  {id:'strawberries',name:'Strawberries',emoji:'🍓',category:'Berries',baseScore:75,desc:'Rich in vitamin C',mm:{balanced:1,dieting:1.1,digestion:1}},
  {id:'acai',name:'Acai',emoji:'🟣',category:'Berries',baseScore:100,desc:'Highest ORAC berry',mm:{balanced:1,dieting:1.3,digestion:1}},

const PORTION_MULTIPLIERS = {palm:1.0,fist:1.4,handful:0.6,thumb:0.3};
const PORTION_LABELS = {palm:'✋ Palm',fist:'✊ Fist',handful:'🤲 Handful',thumb:'👍 Thumb'};
const CATEGORIES = ['All',...new Set(ANTIOXIDANT_FOODS.map(f=>f.category))];
const MEAL_TYPES = ['Breakfast','Lunch','Dinner','Snack'];
const MEAL_EMOJI = {Breakfast:'🌅',Lunch:'☀️',Dinner:'🌙',Snack:'🍎'};
const MEAL_BADGE = {Breakfast:'badge-amber',Lunch:'badge-green',Dinner:'badge-teal',Snack:'badge-red'};
const ACT_TYPES = ['Walking','Cardio','Strength','Yoga','Sports','Other'];
const ACT_EMOJI = {Walking:'🚶',Cardio:'🏃',Strength:'💪',Yoga:'🧘',Sports:'⚽',Other:'✨'};
const TIPS = [
  "Don't stress about exact calories — rough estimates still build awareness over time.",
  "Eating protein with every meal keeps you fuller longer. Think eggs, dal, paneer, or lentils.",
  "Vegetables are almost free calories! Fill half your plate with them at lunch and dinner.",
  "Drink a glass of water before meals — it can naturally reduce overeating.",
  "Consistent meal times help regulate hunger hormones and energy levels.",
];

function calcScore(food, portion, mode) {
  return Math.round(food.baseScore * (PORTION_MULTIPLIERS[portion]||1) * (food.mm[mode]||1));
}

// ─── Meals Tab ───────────────────────────────────────────────────────────────
function MealsTab({ meals, setMeals }) {
  const [name,setName]=useState('');
  const [cal,setCal]=useState('');
  const [mealType,setMealType]=useState('Breakfast');
  const [notes,setNotes]=useState('');
  const [tip]=useState(TIPS[Math.floor(Math.random()*TIPS.length)]);

  const add=()=>{
    if(!name.trim()) return;
    setMeals(prev=>[...prev,{id:Date.now(),name:name.trim(),cal:parseInt(cal)||0,meal:mealType,notes:notes.trim()}]);
    setName('');setCal('');setNotes('');
  };
  return (
    <div className="content">
      <div className="onboard slide-up">
        <div className="onboard-icon">👋</div>
        <div className="onboard-text"><strong>Welcome, beginner!</strong> Just log what you eat with rough calories. Tracking itself is the habit that changes everything.</div>
      </div>
      <div className="card">
        <div className="sec-label">add a meal</div>
        <input className="form-field" placeholder="What did you eat? e.g. oats with banana" value={name} onChange={e=>setName(e.target.value)} onKeyDown={e=>e.key==='Enter'&&add()}/>
        <div className="form-row">
          <select className="form-field" value={mealType} onChange={e=>setMealType(e.target.value)} style={{flex:1}}>

          </select>
          <input type="number" className="form-field" placeholder="kcal" value={cal} onChange={e=>setCal(e.target.value)} style={{width:90}} min={0}/>
          <button className="btn-primary" onClick={add}>+ Add</button>
        </div>
        <input className="form-field" placeholder="Notes (optional)" value={notes} onChange={e=>setNotes(e.target.value)} style={{marginBottom:0}}/>
      </div>
      <div className="card">
        <div className="sec-label">today's meals</div>
        {meals.length===0
          ? <div className="empty"><div className="empty-icon">🍽️</div>No meals yet — add your first one above!</div>

      <div className="tip-card">

  );
}

// ─── Summary Tab ─────────────────────────────────────────────────────────────
function SummaryTab({ meals, activities, antioxScore, calGoal, setCalGoal }) {
  const calIn=meals.reduce((s,m)=>s+m.cal,0);
  const calOut=activities.reduce((s,a)=>s+a.cal,0);
  const net=calIn-calOut;
  const actMin=activities.reduce((s,a)=>s+a.dur,0);
  const pct=Math.min(120,Math.round((calIn/(calGoal||1))*100));
  const barColor=pct>110?'#E24B4A':pct>88?'#EF9F27':'#1D9E75';
  const deficit=calGoal-net;
  const antioxLvl=antioxScore>=400?{label:'🌟 Excellent antioxidant day!',style:{background:'#EAF3DE',color:'#3B6D11',borderColor:'#639922'}}:antioxScore>=200?{label:'👍 Good antioxidant intake',style:{background:'#FAEEDA',color:'#854F0B',borderColor:'#EF9F27'}}:{label:'🫐 Log more colourful whole foods',style:{background:'#FAECE7',color:'#993C1D',borderColor:'#D85A30'}};
  const achievements=[
    {icon:'🌱',name:'First Step',desc:'Log your first meal',unlocked:meals.length>=1},
    {icon:'🏃',name:'Mover',desc:'Log your first activity',unlocked:activities.length>=1},
    {icon:'🫐',name:'Antioxidant',desc:'Score 200+ pts today',unlocked:antioxScore>=200},
    {icon:'⚖️',name:'Balanced',desc:'Log 3+ meals today',unlocked:meals.length>=3},
    {icon:'🔥',name:'Active Day',desc:'30+ active minutes',unlocked:actMin>=30},
    {icon:'🌟',name:'Oxidative Shield',desc:'Score 400+ pts today',unlocked:antioxScore>=400},
  ];
  return (
    <div className="content">
      <div className="metrics-grid">
        {[{val:calIn,lbl:'kcal eaten',sub:'today'},{val:calOut,lbl:'kcal burned',sub:'from exercise'},{val:net,lbl:'net kcal',sub:deficit>0?`${deficit} under goal`:`${Math.abs(deficit)} over`},{val:antioxScore,lbl:'antioxidant',sub:antioxScore>=400?'excellent':antioxScore>=200?'good':'keep going'}].map(m=>(
          <div key={m.lbl} className="metric">
            <div className="metric-val">{m.val}</div>
            <div className="metric-lbl">{m.lbl}</div>
            <div className="metric-sub">{m.sub}</div>
          </div>
        ))}
      </div>
      <div className="card">
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:4}}>
          <div className="sec-label" style={{marginBottom:0}}>Calorie goal</div>
          <input type="number" value={calGoal} onChange={e=>setCalGoal(parseInt(e.target.value)||2000)} style={{width:90,textAlign:'center',background:'var(--surf2)',border:'1px solid var(--border)',borderRadius:6,padding:'4px 8px',fontSize:13,color:'var(--text)',fontFamily:'DM Sans,sans-serif',outline:'none'}} min={500}/>
        </div>
        <div className="prog-wrap"><div className="prog-bar" style={{width:`${Math.min(100,pct)}%`,background:barColor}}/></div>
        <div className="prog-lbl">{calIn} of {calGoal} kcal ({pct}%)</div>
      </div>
      {antioxScore>0&&<div className="balance-block" style={{...antioxLvl.style,marginBottom:10}}>{antioxLvl.label}</div>}
      <div className="card">
        <div className="sec-label">at a glance</div>
        {[['Meals logged',meals.length],['Activities logged',activities.length],['Active time',`${actMin} min`],['Net calories',`${net} kcal`],['Antioxidant score',`${antioxScore} pts`]].map(([l,v])=>(
          <div key={l} className="goal-row"><span style={{color:'var(--text2)'}}>{l}</span><span style={{fontWeight:500}}>{v}</span></div>
        ))}
      </div>
      {(meals.length>0||activities.length>0)&&(
        <div className="balance-block" style={{marginBottom:10,background:deficit>250?'#EAF3DE':deficit<-250?'#FAECE7':'#FAEEDA',color:deficit>250?'#3B6D11':deficit<-250?'#993C1D':'#854F0B',borderColor:deficit>250?'#639922':deficit<-250?'#D85A30':'#EF9F27'}}>
          {deficit>250?`✅ You're in a ${deficit} kcal deficit — great for gradual, healthy weight loss!`:deficit<-250?`⚠️ You're ${Math.abs(deficit)} kcal over your goal. A short walk or lighter snack will help.`:'⚖️ You\'re nicely balanced today! Keep the consistency going.'}
        </div>
      )}
      <div className="card">
        <div className="sec-label">achievements</div>
        <div className="badge-grid">
          {achievements.map(a=>(
            <div key={a.name} className={`achievement ${a.unlocked?'unlocked':''}`}>
              <div className="ach-icon">{a.icon}</div>
              <div><div className="ach-name">{a.name}</div><div className="ach-desc">{a.desc}</div></div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ─── AI Coach Tab ─────────────────────────────────────────────────────────────
function AICoachTab({ meals, activities, antioxScore, calGoal, mode }) {
  const [context,setContext]=useState('');
  const [result,setResult]=useState('');
  const [loading,setLoading]=useState(false);

  const run=async()=>{
    if(!meals.length&&!activities.length&&!antioxScore){
      setResult('Please log at least one meal, activity, or antioxidant food before running your analysis!');
      return;
    }
    setLoading(true);setResult('');
    const calIn=meals.reduce((s,m)=>s+m.cal,0);
    const calOut=activities.reduce((s,a)=>s+a.cal,0);
    const foodList=meals.map(m=>`- ${m.meal}: ${m.name}${m.cal?` (${m.cal} kcal)`:''}`).join('\n')||'None logged';
    const actList=activities.map(a=>`- ${a.name} (${a.type})${a.dur?`, ${a.dur} min`:''}${a.cal?`, ~${a.cal} kcal burned`:''}`).join('\n')||'None logged';
    const prompt=`You are a warm, encouraging health coach for fitness beginners. Be friendly, simple, non-judgmental. No jargon.

${context?`About this person:\n${context}\n\n`:''}Active mode: ${mode}
Daily calorie goal: ${calGoal} kcal
Calories consumed: ${calIn} kcal
Calories burned: ${calOut} kcal
Net calories: ${calIn-calOut} kcal
Antioxidant score: ${antioxScore} pts

Meals:\n${foodList}

Activities:\n${actList}

Give them:
1. Warm overall assessment (2-3 sentences). Celebrate wins.
2. 2-3 beginner-friendly actionable improvements for tomorrow.
3. Note on antioxidant intake — is ${antioxScore} pts good?
4. One simple thing to do in the next hour to feel better.
5. Encouraging sign-off.

Under 280 words. Numbered points. Warm and human.`;
    try{
      const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,messages:[{role:'user',content:prompt}]})});
      const data=await res.json();
      setResult((data.content||[]).map(b=>b.text||'').join('')||'No response. Please try again.');
    }catch{
      setResult('Could not connect to Claude AI. Please check your internet connection and try again.');
    }
    setLoading(false);
  };

  return (
    <div className="content">
      <div className="tip-card slide-up" style={{background:'var(--g800)'}}>
        <div className="tip-label">✨ Powered by Claude AI</div>
        <div className="tip-text">Your personal AI coach reviews meals, activity & antioxidant intake — then gives beginner-friendly, personalised advice tailored to your exact day.</div>
      </div>
      <div className="card">
        <div className="sec-label">about you (optional)</div>
        <textarea className="form-field" placeholder="Tell your coach about yourself — age, weight goal, diet type, fitness level, any health conditions..." value={context} onChange={e=>setContext(e.target.value)} rows={3} style={{resize:'vertical',minHeight:80,marginBottom:0}}/>
      </div>
      <button className="btn-primary btn-full" onClick={run} disabled={loading}>
        {loading?<><span className="pulse">●</span> Analysing your day...</>:<>✨ Get my AI health insights</>}
      </button>
      {(result||loading)&&(
        <div className="card fade-in" style={{marginTop:10}}>
          <div className="sec-label">your personalised insights</div>
          {loading
            ? <div style={{color:'var(--text3)',fontStyle:'italic',fontSize:13}}>Your AI coach is reviewing your day…</div>
            : <div className="ai-output">{result}</div>
          }
        </div>
      )}
    </div>
  );
}

// ─── Main App ─────────────────────────────────────────────────────────────────
const TABS=[
  {id:'meals',label:'Meals',icon:'🍽️'},
  {id:'activity',label:'Activity',icon:'🏃'},
  {id:'balance',label:'Balance',icon:'🫐'},
  {id:'summary',label:'Summary',icon:'📊'},
  {id:'ai',label:'AI Coach',icon:'✨'},
];

function App() {
  const [user,setUser]=useState(null);
  const [tab,setTab]=useState('meals');
  const [meals,setMeals]=useState([]);
  const [activities,setActivities]=useState([]);
  const [foodLogs,setFoodLogs]=useState([]);
  const [calGoal,setCalGoal]=useState(2000);
  const [mode,setMode]=useState('balanced');

  const calIn=meals.reduce((s,m)=>s+m.cal,0);
  const calOut=activities.reduce((s,a)=>s+a.cal,0);
  const actMin=activities.reduce((s,a)=>s+a.dur,0);
  const antioxScore=foodLogs.reduce((s,l)=>s+l.score,0);

  if(!user) return <LoginScreen onLogin={name=>setUser(name)}/>;

  return (
    <div style={{flex:1,display:'flex',flexDirection:'column',background:'var(--bg)'}}>
      <div className="app-wrap">
        <HeroHeader user={user} calIn={calIn} calOut={calOut} actMin={actMin} antioxScore={antioxScore} mode={mode} onLogout={()=>setUser(null)}/>
        <div className="tab-bar">
          {TABS.map(t=>(
            <button key={t.id} className={`tab-btn ${tab===t.id?'active':''}`} onClick={()=>setTab(t.id)}>
              <span className="tab-icon">{t.icon}</span>{t.label}
            </button>
          ))}
        </div>
        {tab==='meals'    &&<MealsTab meals={meals} setMeals={setMeals}/>}
        {tab==='activity' &&<ActivityTab activities={activities} setActivities={setActivities}/>}
        {tab==='balance'  &&<BellyBalanceTab mode={mode} setMode={setMode} foodLogs={foodLogs} setFoodLogs={setFoodLogs}/>}
        {tab==='summary'  &&<SummaryTab meals={meals} activities={activities} antioxScore={antioxScore} calGoal={calGoal} setCalGoal={setCalGoal}/>}
        {tab==='ai'       &&<AICoachTab meals={meals} activities={activities} antioxScore={antioxScore} calGoal={calGoal} mode={mode}/>}
        <footer>FitStart &copy; 2025 &nbsp;·&nbsp; Built for fitness beginners 🌱 &nbsp;·&nbsp; AI powered by Claude</footer>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
